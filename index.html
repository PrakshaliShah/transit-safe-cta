<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Transit Safe: CTA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* General Layout */
        body { padding: 0; margin: 0; background-color: #0f172a; }
        .container { padding: 20px; max-width: 1200px; } 

        /* Side-by-Side Grid */
        .main-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: 2fr 1fr; /* 70/30 split on wide screens */
        }

        /* Map Container */
        #map { 
            height: 600px; 
            width: 100%; 
            border-radius: 12px; 
            border: 2px solid #334155;
            z-index: 1;
        }

        /* Controls Panel (Right Column) */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #1e293b;
            padding: 20px; 
            border-radius: 12px;
            height: 600px; /* Match map height */
        }
        
        /* Status Box / Result Panel */
        .status-panel { 
            background: #11191f; 
            padding: 15px; 
            border-radius: 8px; 
            flex-grow: 1; 
            overflow-y: auto; 
        }
        
        /* Header Styling */
        .app-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1rem;
        }
        .app-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Groups Run ID and Badge */
        .status-header {
            display: flex;
            align-items: center; 
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 5px;
        }

        /* Status Header Text */
        #trainId {
            margin: 0;
            font-size: 1.2rem; 
            padding-right: 10px; 
            white-space: nowrap; 
        }
        
        /* Badge Adjustment */
        #confBadge {
            padding: 3px 6px !important; 
            font-size: 0.65rem !important; 
            white-space: nowrap; 
        }
        
        /* Button Grid Adjustment */
        .grid button {
            font-size: 0.90rem; 
            padding: 10px 5px;
            line-height: 1.2; 
        }

        .btn-danger
